# 后端依赖与测试入口；uv.lock 锁定经过验证的安装结果。
[project]
name = "yingxu-backend"
version = "0.1.0"
description = "映序模块化 API 与可插拔供应商运行层"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.119,<0.120",
  "uvicorn[standard]>=0.37,<0.38",
  "sqlalchemy>=2.0.44,<2.1",
  "alembic>=1.17,<1.18",
  "pydantic-settings>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0.3,<7",
  "httpx[socks]>=0.28,<0.29",
  "python-multipart>=0.0.20,<0.1",
  "pillow>=12,<13",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.5,<6",
  "redis>=6.4,<7",
  "langgraph>=1.0,<1.1",
  "pgvector>=0.4,<0.5",
  "pypdf>=6,<7",
]
[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# M0 质量门禁：语法、未使用变量、导入顺序及必要说明，格式由 Ruff 统一。
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]
[tool.ruff.lint.per-file-ignores]
"app/core/models.py" = ["F401"]
"migrations/env.py" = ["F401"]
