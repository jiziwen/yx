# 写真套系和镜头独立配置；当前既有样片仅用于内测，生产过滤 development_only 镜头。
version: creative-v2
aspect_ratios:
- '3:4'
- '4:3'
- '1:1'
- '2:3'
- '3:2'
- '16:9'
- '9:16'
max_count: 8
styles:
- id: rose_wedding_01
  version: '1'
  name: 玫瑰画廊
  theme_id: rose
  image: /images/theme-rose.webp
  kind: wedding
  mood: 浪漫柔光
  description: 浪漫柔光 · 选一张心动样片，开始自己的故事。
